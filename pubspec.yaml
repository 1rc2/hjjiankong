name: hjjiankong
description: "黄金价格监控 App：模拟行情 + 黄金资讯 + 持仓盈亏 + GitHub 版本更新"
publish_to: "none"

# 应用版本号（发布 GitHub Release 时 tag 必须写 v1.0.0 与此对应，代码会自动去掉 v）
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== 网络请求（GitHub API / 行情接口）=====
  http: ^1.2.2
  # ===== 获取 App 版本号（版本更新对比用）=====
  package_info_plus: ^8.1.0
  # ===== 版本号大小对比（1.0.2 > 1.0.1）=====
  version_compare: ^1.2.4
  # ===== APK 下载（后台 WorkManager 下载 + 通知栏进度）=====
  # 注意：必须用 1.12.0+，1.11.x 存在 SQL 注入漏洞且不兼容 AGP 8
  flutter_downloader: ^1.12.0
  # ===== 本地持久化（持股数据 / 主题偏好）=====
  shared_preferences: ^2.3.3
  # ===== 获取应用存储目录（APK 下载保存路径）=====
  path_provider: ^2.1.5
  # ===== 打开外部链接（前往 GitHub Release 手动下载）=====
  url_launcher: ^6.3.1
  # ===== 基础图标库 =====
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
